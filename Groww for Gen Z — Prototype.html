<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Groww for Gen Z — Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4fa;--card:#fff;--ink:#0d1530;--mute:#5d6683;--line:#e1e5f0;--brand:#3446d6;--bk:#fff;--soft:#e8ebfb;--sun:#ffb62e;--ok:#087148;--bad:#c4321f;--warn:#9a5a00;--warnbg:#fff3dc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151c33;--ink:#eef1fb;--mute:#9aa4c4;--line:#27304f;--brand:#8b98ff;--bk:#0b1020;--soft:#1e2748;--ok:#3ccf91;--bad:#ff8a78;--warn:#ffc766;--warnbg:#3a2d10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151c33;--ink:#eef1fb;--mute:#9aa4c4;--line:#27304f;--brand:#8b98ff;--bk:#0b1020;--soft:#1e2748;--ok:#3ccf91;--bad:#ff8a78;--warn:#ffc766;--warnbg:#3a2d10;color-scheme:dark}
*{box-sizing:border-box;margin:0}html,body{height:100%}body{background:var(--bg);color:var(--ink);font:500 15px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
#app{max-width:430px;margin:0 auto;min-height:100%;padding:20px 18px 96px;position:relative}
h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em}h2{font-size:18px;font-weight:800;margin:22px 0 10px}h3{font-size:15px;font-weight:700}
.m{color:var(--mute)}.sm{font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.col{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font:700 15px inherit;font-family:inherit;background:var(--brand);color:var(--bk);cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.35;cursor:not-allowed}.btn.g{background:var(--soft);color:var(--brand)}.btn.sm2{width:auto;padding:9px 14px;margin:0;font-size:13px}
button:focus-visible,input:focus-visible,.opt:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.in{width:100%;margin-top:18px;padding:15px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 16px inherit;font-family:inherit}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--ink);font-family:inherit;cursor:pointer}
.opt b{display:block;font-size:15px}.opt span{font-size:13px;color:var(--mute)}.opt.on{border-color:var(--brand);background:var(--soft)}
.dots{display:flex;gap:6px;margin-bottom:26px}.dots i{height:4px;flex:1;border-radius:4px;background:var(--line)}.dots i.on{background:var(--brand)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--brand)}.tag.w{background:var(--warnbg);color:var(--warn)}.tag.o{background:var(--soft);color:var(--ok)}
.t{border-bottom:1.5px dotted var(--brand);color:var(--brand);cursor:help;font-weight:700}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:none;color:var(--mute);font:700 11px inherit;font-family:inherit;padding:6px;cursor:pointer}.nav button b{display:block;font-size:19px}.nav button.on{color:var(--brand)}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:8px}
.risk{display:flex;gap:4px}.risk i{flex:1;height:8px;border-radius:4px;background:var(--line)}.risk i.on{background:var(--sun)}
.sheet{position:fixed;inset:0;background:rgba(5,8,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet>div{background:var(--card);width:min(100%,430px);border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}@media(prefers-reduced-motion:reduce){.sheet>div{animation:none}}
.tg{width:46px;height:28px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--brand)}.tg.on:after{left:21px}
input[type=range]{width:100%;accent-color:var(--brand)}.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chips button{white-space:nowrap}
.warnbox{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600}
.back{border:0;background:none;color:var(--brand);font:700 14px inherit;font-family:inherit;cursor:pointer;padding:0 0 14px}
.stp{display:flex;align-items:center;gap:12px}.stp button{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.ring{display:grid;place-items:center}.big{font-size:34px;font-weight:800;letter-spacing:-.02em}
button.tag,.chips button{min-height:40px}.back{min-height:44px}.opt,.btn{min-height:48px}.stp button{width:44px;height:44px}.row b{text-align:right}
.tg{width:52px;height:32px}.tg:after{width:26px;height:26px}.tg.on:after{left:23px}
@media(min-width:600px){body{background:var(--soft)}#app{background:var(--bg);min-height:100%}}
@media(max-width:360px){h1{font-size:24px}.big{font-size:28px}#app{padding-inline:14px}}
.sheet>div{max-height:90%;overflow-y:auto;overscroll-behavior:contain}h1:focus{outline:none}
</style></head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s),R=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const TERMS={sip:['SIP','Systematic Investment Plan: you invest a fixed amount on a fixed date every month, automatically.','Like a gym membership for your money. Small and regular beats big and rare.','You don\'t need to time the market. You can start with ₹100–500 and pause anytime.'],
nav:['NAV','Net Asset Value: the price of one unit of a mutual fund today.','Like the price tag on one slice of a pizza. A "cheap" NAV does not mean a better fund.','Never pick a fund because its NAV looks low. Look at risk, cost and time horizon instead.'],
expense:['Expense ratio','The yearly fee a fund charges, shown as a % of your money. It is deducted quietly from the fund\'s value.','Like a small subscription charged inside the fund, so you never see a bill.','A 1% fee vs a 0.2% fee can cost you lakhs over 20 years. Lower is usually better.'],
vol:['Volatility','How much a fund\'s value jumps up and down along the way.','Like a road with speed breakers. Bumpy is not the same as broken.','Higher volatility means you need a longer timeline. Short goals need smooth roads.'],
risk:['Riskometer','A SEBI-mandated 6-level label from "low" to "very high" showing how much a fund can swing.','Like a weather forecast for losses. It tells you how stormy it could get.','Match the risk to when you need the money, not to what your friends are buying.'],
div:['Diversification','Spreading money across many companies or assets so one bad bet does not sink you.','Like not eating at only one restaurant for the whole year.','Funds do this for you. A single stock does not.'],
index:['Index fund','A fund that simply copies a market index like Nifty 50: the 50 biggest listed companies.','Like buying a tiny slice of the whole top-50 basket instead of picking winners.','Low cost, no fund-manager guesswork, and a good long-term starter.'],
exit:['Exit load','A small penalty some funds charge if you withdraw too early.','Like a cancellation fee on a booking.','Check it before investing if you might need the money soon.'],
infl:['Inflation','The slow rise in prices that makes ₹100 buy less each year.','Like your pizza costing ₹300 now and ₹400 in a few years.','Money sitting idle loses buying power. Investing is one way to keep up.'],
comp:['Compounding','Earning returns on your past returns, so growth snowballs over time.','Like a snowball rolling downhill, slow at first and then fast.','Time matters more than amount. Starting at 22 beats starting at 32.']};
const T=(k,l)=>`<span class="t" tabindex="0" data-a="term" data-v="${k}">${l||TERMS[k][0]}</span>`;
const F={liq:{n:'Liquid Fund',c:'Debt',risk:1,yr:0,ex:'a small charge only if you withdraw within 7 days',exp:.2,r:[5,6.5,7.2],why:'Parks money safely for short goals.',w:'Your money sits in very short-term, high-quality lending.',bad:['Returns are modest, a little above a savings account','Will not beat inflation over many years']},
debt:{n:'Short Duration Debt Fund',c:'Debt',risk:2,yr:1,ex:'no charge',exp:.35,r:[3,7,8.5],why:'Steady and calm for goals 1–2 years away.',w:'Your money lends to companies and the government for 1–3 years.',bad:['Can dip slightly if interest rates rise','Returns are not guaranteed']},
hyb:{n:'Balanced Advantage Fund',c:'Hybrid',risk:3,yr:3,ex:'1% if you withdraw within 1 year',exp:.55,r:[-4,9,14],why:'Mixes shares and debt, so dips are softer.',w:'The fund shifts between shares and debt automatically.',bad:['Can lose money in a 1–2 year window','Costs more than an index fund']},
idx:{n:'Nifty 50 Index Fund',c:'Equity',risk:4,yr:5,ex:'0.25% if you withdraw within 30 days',exp:.2,r:[-8,11,18],why:'Own the top 50 companies at very low cost.',w:'Your money is spread across India\'s 50 largest companies.',bad:['Can fall 20–30% in a bad year','Needs 5+ years to be reasonably safe']},
flexi:{n:'Flexi Cap Fund',c:'Equity',risk:5,yr:5,ex:'1% if you withdraw within 1 year',exp:.75,r:[-12,12,21],why:'A manager picks winners across company sizes.',w:'A fund manager chooses companies of any size for you.',bad:['Biggest swings of all five options','Manager choices can underperform the index']}};
const RL=['','Very low','Low','Moderate','High','Very high'];
const GT={Emergency:[30000,12],Laptop:[60000,12],Trip:[40000,8],Studies:[300000,48],'Just start':[50000,36]};
const IN={Stipend:['Internship stipend','Regular, but small',500],Salary:['First salary','Your first real paycheck',2000],Gigs:['Part-time or gigs','Some months more, some less',1000],Freelance:['Freelance','Irregular income',1000]};
const LS=[['Why start with ₹500',['Time in the market matters more than the amount. A small start builds the habit.','₹500 a month for 5 years is ₹30,000 of your own money, before any growth.','Rule: start small, increase when your income grows.']],['Risk is not danger',['Risk means how bumpy the ride can be, not whether you will lose everything.','Long goals can handle bumps. Short goals cannot.','Always ask: when do I need this money?']],['What a SIP really does',['A SIP buys a little every month, so you buy more when prices are low and less when high.','You never have to guess the "right time".','You can pause or stop anytime.']],['Fees: the quiet cost',['Funds charge a yearly fee called the expense ratio.','On ₹1 lakh, 1% is ₹1,000 a year, every year.','Compare fees between similar funds before choosing.']],['Spotting a finfluencer trap',['Be wary of guaranteed returns, urgency and "only today" tips.','Check if the person is SEBI-registered.','If you cannot explain it in one line, skip it.']],['Emergency fund first',['Before long-term investing, keep 3–6 months of expenses somewhere safe.','A liquid fund works well for this.','Then invest the rest toward goals.']]];
const fv=(m,n,a)=>{const r=a/1200;return r?m*((Math.pow(1+r,n)-1)/r)*(1+r):m*n};
const rec=n=>n<=12?'liq':n<36?'debt':n<60?'hyb':'idx';
const S={scr:'onb',st:0,name:'',inc:null,rk:null,gl:null,goals:[],fund:'idx',d:{g:'Laptop',tg:60000,mo:12,f:null,amt:0},hist:[],dip:false,set:{dip:1,cool:1,hide:1},learn:{},th:'auto',sheet:null,chk:false,mk:'1D',filt:'you',dn:24,dm:500,ls:0,les:0};
const typ=()=>['','Careful Starter','Steady Builder','Growth Explorer'][S.rk||2],cap=()=>[0,2,3,4][S.rk||2],start=()=>S.inc?IN[S.inc][2]:500;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),nm=()=>esc(S.name)||'there',inv=()=>S.goals.reduce((a,g)=>a+g.inv,0);
const go=(s,h=1)=>{if(h)S.hist.push(S.scr);S.scr=s;S.sheet=null;render(1)};
const tabs=['home','explore','goals','learn','prof'];
function outHTML(f,m,n){const x=F[f],v=x.r.map(a=>fv(m,n,a-x.exp)),mx=Math.max(...v),L=['If it goes badly','Most likely','If it goes well'];
return `<div class="row sm m"><span>You put in</span><b style="color:var(--ink)">${R(m*n)}</b></div>`+v.map((a,i)=>`<div style="margin-top:10px"><div class="row sm"><span>${L[i]}</span><b>${R(a)}</b></div><div class="bar"><i style="width:${Math.max(4,a/mx*100)}%;background:${['var(--bad)','var(--brand)','var(--ok)'][i]}"></i></div></div>`).join('')+`<p class="sm m" style="margin-top:10px">Assumes ${x.r[0]}%, ${x.r[1]}% and ${x.r[2]}% a year before fees; amounts shown are after the ${x.exp}% fee. Illustrative, not a promise. Real returns can be lower than the worst case.</p>`}
function goalLive(){const {tg,mo}=S.d,r=rec(mo),f=S.d.f||r,ids=[...new Set([r,S.fund,'liq'])].filter(i=>i),nd=Math.ceil(tg/fv(1,mo,6)/50)*50;
return `<div class="card" style="margin-top:14px"><div class="row"><span class="m">To reach ${R(tg)} you need about</span></div><div class="big">${R(nd)}<span class="sm m"> / month</span></div></div><p class="sm m" style="margin-top:8px">We plan with a cautious 6% a year, not the best case. Real returns can be lower.</p>${nd>start()*8?`<div class="warnbox" style="margin-top:10px">That is a lot to set aside each month. Try a longer timeline or a smaller target. You can also start smaller and top up later.<br><button class="btn g sm2" style="margin-top:8px" data-a="ease">Stretch to ${Math.min(120,mo*2)} months</button></div>`:''}
<h2>Pick where it goes</h2><div class="col">`+ids.map(i=>{const x=F[i],bad=mo<x.yr*12;return `<button class="opt ${f===i?'on':''}" data-a="plan" data-v="${i}"><div class="row"><b>${x.n}</b><span class="tag ${bad?'w':''}">${RL[x.risk]} risk</span></div><span>${x.why}</span>${i===r?'<br><span class="tag o" style="margin-top:6px">Best fit for '+mo+' months</span>':''}${bad?'<br><span style="color:var(--warn);font-weight:600">Built for '+x.yr+'+ years: too short for this goal</span>':''}</button>`}).join('')+'</div>'}
const V={
onb(){const s=S.st,dots='<div class="dots">'+[0,1,2,3,4].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')+'</div><p class="sm m" style="margin:-14px 0 18px">Step '+(s+1)+' of 5 · under a minute</p>',bk=s?'<button class="back" data-a="obk">‹ Back</button>':'';
if(s==0)return `<div style="padding-top:30px">${dots}<h1>Your first investment, minus the confusion.</h1><p class="m" style="margin-top:10px">No jargon. No pressure. We explain everything before you invest. What should we call you?</p><input class="in" data-i="name" placeholder="Your first name (optional)" aria-label="Your first name" maxlength="24" value="${esc(S.name)}"><button class="btn" data-a="nx">Continue</button></div>`;
if(s==1)return `${bk}${dots}<h1>Where is your money coming from?</h1><p class="m" style="margin:8px 0 18px">We only use this to suggest a monthly amount you will not miss. Change it anytime.</p><div class="col">${Object.entries(IN).map(([k,v])=>`<button class="opt ${S.inc==k?'on':''}" data-a="inc" data-v="${k}"><b>${v[0]}</b><span>${v[1]}</span></button>`).join('')}</div>`;
if(s==2)return `${bk}${dots}<h1>Your ₹5,000 drops to ₹4,600 next month.</h1><p class="m" style="margin:8px 0 18px">No right answer. What would you most likely do?</p><div class="col">${[[1,'Withdraw it','Better safe than sorry'],[2,'Wait and watch','See what happens over time'],[3,'Add more','Prices are lower now']].map(o=>`<button class="opt ${S.rk==o[0]?'on':''}" data-a="rk" data-v="${o[0]}"><b>${o[1]}</b><span>${o[2]}</span></button>`).join('')}</div>`;
if(s==3)return `${bk}${dots}<h1>What's your first money goal?</h1><p class="m" style="margin:8px 0 18px">Investing works best with a reason attached.</p><div class="col">${Object.keys(GT).map(k=>`<button class="opt ${S.gl==k?'on':''}" data-a="gl" data-v="${k}"><b>${k}</b><span>${R(GT[k][0])} in about ${GT[k][1]} months</span></button>`).join('')}</div>`;
return `${bk}${dots}<h1>You're a ${typ()}.</h1><p class="m" style="margin:8px 0 16px">${['','You prefer calm and certainty. We will start with steady options and explain every step.','You are comfortable waiting out dips. We will balance safety and growth.','You can handle bumps for the right reward. We will still match risk to your timeline.'][S.rk]}</p><div class="card col"><div class="row"><span class="m">Suggested start</span><b>${R(start())}/month</b></div><div class="row"><span class="m">First goal</span><b>${S.gl}</b></div><div class="row"><span class="m">Comfortable risk up to</span><b>${RL[cap()]}</b></div></div><p class="sm m" style="margin-top:12px">You can change all of this later in Profile.</p><button class="btn" data-a="fin">Show my home</button>`},
home(){const g=S.goals[0],t=inv(),val=S.dip?t*.96:t;
return `<div class="row"><div><p class="m sm">Good to see you</p><h1 style="font-size:24px">Hey ${nm()}</h1></div><button class="tag" style="border:0;font-size:14px;padding:9px 13px;cursor:pointer" data-a="tab" data-v="prof" aria-label="Profile">${esc(((S.name||'R').trim()[0]||'R').toUpperCase())}</button></div>
${S.dip&&g&&S.set.dip?`<div class="card" style="margin-top:16px;border-color:var(--sun)"><h3>Your money is down ${R(t*.04)} (4%)</h3><p class="sm m" style="margin:6px 0 10px">${F[g.f].risk>=3?'This is a normal dip for a '+F[g.f].c.toLowerCase()+' fund. Dips like this are common, and short-term moves rarely tell the long-term story. Withdrawing now would turn a paper loss into a real one.':'A fall this size is unusual for a low-risk fund, so it is worth reading the fund page before you decide anything. Withdrawing now would turn a paper loss into a real one.'}</p><div class="row" style="gap:8px"><button class="btn sm2" data-a="dipok" style="flex:1">Keep going</button><button class="btn g sm2" data-a="wd" style="flex:1">I want to withdraw</button></div></div>`:''}
${g?`<div class="card" style="margin-top:16px"><div class="row"><div><p class="m sm">Your goal</p><h3>${g.name}</h3></div><span class="tag o">${Math.round(g.inv/g.tg*100)}% there</span></div><div class="big" style="margin:10px 0 8px">${R(S.dip?g.inv*.96:g.inv)}</div><div class="bar"><i style="width:${Math.max(3,g.inv/g.tg*100)}%;background:var(--sun)"></i></div><p class="sm m" style="margin-top:8px">of ${R(g.tg)} · ${g.amt?R(g.amt)+' every month':''}</p></div>`:
`<div class="card" style="margin-top:16px;background:var(--brand);color:var(--bk);border:0"><p class="sm" style="opacity:.85">Your first step</p><h2 style="font-size:24px;margin:6px 0 8px">Start with ${R(start())} a month toward your ${S.gl||'first'} goal.</h2><p class="sm" style="opacity:.85">We'll show best, likely and worst cases before you commit.</p><button class="btn" style="background:var(--bk);color:var(--brand)" data-a="newgoal">Create my first goal</button></div>`}
<h2>${g?'This month':'While you get started'}</h2><div class="col">${g?'<div class="card"><h3>Month 1 of 6</h3><p class="sm m">Missed a month? That is fine. Pause and resume anytime.</p></div>':''}
<button class="card row opt" data-a="tab" data-v="explore"><div><h3>Market today, in plain words</h3><p class="sm m">The 50 biggest companies moved −0.4% today. A normal day, nothing to do.</p></div><span class="m">›</span></button>
${(()=>{const n=LS.findIndex((_,i)=>!S.learn[i]);return n<0?`<button class="card row opt" data-a="tab" data-v="learn"><div><h3>All lessons done</h3><p class="sm m">Revisit any lesson in Learn</p></div><span class="m">›</span></button>`:`<button class="card row opt" data-a="les" data-v="${n}"><div><h3>2-minute lesson: ${LS[n][0]}</h3><p class="sm m">${Object.keys(S.learn).length}/${LS.length} completed</p></div><span class="m">›</span></button>`})()}</div>
`},
explore(){const mk={'1D':['−0.4%','A normal day. Daily moves are mostly noise.'],'1Y':['+11.2%','Zooming out shows the bigger picture.'],'5Y':['+78%','Long periods smooth out the bumps.']},m=mk[S.mk];
const gm=S.goals[0]?S.goals[0].mo:S.gl?GT[S.gl][1]:0,gf=gm?rec(gm):null,list=Object.keys(F).filter(i=>S.filt=='you'?F[i].risk<=cap()+1:S.filt=='safe'?F[i].risk<=2:F[i].risk>=3);
return `<h1 style="font-size:24px">Explore</h1><p class="m sm" style="margin-top:4px">Picked for goals, not hype. No hot tips here.</p>
<div class="card" style="margin-top:14px"><div class="row"><h3>Market in plain words</h3><div class="chips">${['1D','1Y','5Y'].map(k=>`<button class="tag ${S.mk==k?'':'w'}" style="border:0;cursor:pointer;${S.mk==k?'':'background:var(--soft);color:var(--mute)'}" data-a="mk" data-v="${k}">${k}</button>`).join('')}</div></div><div class="big" style="margin-top:8px;color:${S.mk=='1D'?'var(--bad)':'var(--ok)'}">${m[0]}</div><p class="sm m">${m[1]} Nifty 50 means the ${T('index','top 50 companies')} in India.</p></div>
<div class="chips" style="margin:16px 0 4px">${[['you','For you'],['safe','Safer'],['grow','Long-term growth']].map(a=>`<button class="tag" style="border:0;padding:8px 14px;cursor:pointer;${S.filt==a[0]?'':'background:var(--soft);color:var(--mute)'}" data-a="filt" data-v="${a[0]}">${a[1]}</button>`).join('')}</div>

learn(){const n=Object.keys(S.learn).length;return `<h1 style="font-size:24px">Learn</h1><p class="m sm" style="margin:4px 0 14px">${n}/${LS.length} done · 2 minutes each</p><div class="bar"><i style="width:${n/LS.length*100}%"></i></div><div class="col" style="margin-top:16px">${LS.map((l,i)=>`<button class="opt row" data-a="les" data-v="${i}"><div><b>${l[0]}</b><span>${S.learn[i]?'Completed':'3 quick cards'}</span></div><span class="tag ${S.learn[i]?'o':''}">${S.learn[i]?'✓':'Start'}</span></button>`).join('')}</div><h2>Jargon buster</h2><div class="chips" style="flex-wrap:wrap">${Object.keys(TERMS).map(k=>`<button class="tag" style="border:0;padding:8px 13px;cursor:pointer" data-a="term" data-v="${k}">${TERMS[k][0]}</button>`).join('')}</div>`},
lesson(){const l=LS[S.les],s=S.ls;return `<button class="back" data-a="back">‹ Back</button><div class="dots">${l[1].map((_,i)=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div><p class="m sm">${l[0]}</p><h1 style="margin:10px 0 24px;font-size:24px">${l[1][s]}</h1><div class="row" style="gap:10px">${s?'<button class="btn g" data-a="lp">Back</button>':''}<button class="btn" data-a="ln">${s<2?'Next':'Mark as done'}</button></div>`},
prof(){const tg=(k,l,d)=>`<div class="row card"><div><h3>${l}</h3><p class="sm m">${d}</p></div><button class="tg ${S.set[k]?'on':''}" aria-label="${l}" data-a="tgl" data-v="${k}"></button></div>`;
return `<h1 style="font-size:24px">Profile</h1><div class="card row" style="margin-top:14px"><div><h3>${esc(S.name)||'You'}</h3><p class="sm m">${typ()} · ${S.inc?IN[S.inc][0]:''}</p></div><span class="tag">Max risk: ${RL[cap()]}</span></div>
<h2>Responsible investing</h2><div class="col">${tg('dip','Dip Coach','Calm guidance when markets fall')}${tg('cool','Cooling-off prompt','A pause before risky or panic decisions')}${tg('hide','Hide trading features','No F&amp;O, intraday or stock tips')}</div>
<h2>App</h2><div class="col"><div class="card row"><h3>Theme</h3><button class="btn g sm2" data-a="theme">${S.th[0].toUpperCase()+S.th.slice(1)}</button></div><div class="card row"><h3>Retake investor profile</h3><button class="btn g sm2" data-a="retake">Retake</button></div></div><h2>Demo tools</h2><div class="col"><div class="card row"><div><h3>Simulate a 4% dip</h3><p class="sm m">${S.goals.length?'Shows Dip Coach on Home':'Create a goal first'}</p></div><button class="btn g sm2" data-a="dip" ${S.goals.length?'':'disabled'}>${S.dip?'Turn off':'Simulate'}</button></div><div class="card row"><h3>Restart demo</h3><button class="btn g sm2" data-a="reset">Reset</button></div></div><p class="sm m" style="margin-top:14px">Prototype with illustrative data. Not investment advice.</p>`}};
function sheet(){const s=S.sheet;if(s.k=='term'){const t=TERMS[s.v];return `<div class="sheet" data-a="x"><div data-a="n"><span class="tag">Explain this to me</span><h1 style="font-size:24px;margin:10px 0">${t[0]}</h1><p>${t[1]}</p><p class="m" style="margin:10px 0"><b>Like:</b> ${t[2]}</p><div class="card" style="background:var(--soft);border:0"><b class="sm">Why it matters to you</b><p class="sm">${t[3]}</p></div><button class="btn" data-a="x">Got it</button></div></div>`}
if(s.k=='top'){const g=S.goals[s.v];return `<div class="sheet" data-a="x"><div data-a="n"><h1 style="font-size:22px">Add ${R(g.amt/2)} to ${g.name}?</h1><p class="m" style="margin:10px 0">This is a one-time extra investment into ${F[g.f].n}, with the same risk and fees you agreed to. You can withdraw it later, but its value may have changed.</p><button class="btn" data-a="topok" data-v="${s.v}">Add ${R(g.amt/2)}</button><button class="btn g" data-a="x">Cancel</button></div></div>`}if(s.k=='wdone')return `<div class="sheet" data-a="x"><div data-a="n"><h1 style="font-size:22px">Prototype only</h1><p class="m" style="margin:10px 0">In the real app, your withdrawal would start here. We would show how much you get back and any exit charge first.</p><button class="btn" data-a="x">Got it</button></div></div>`;return `<div class="sheet" data-a="x"><div data-a="n"><h1 style="font-size:22px">Pause for a moment</h1><p class="m" style="margin:10px 0">You are about to withdraw during a dip. Doing it now would turn a temporary ${R(inv()*.04)} drop into a permanent loss. Many investors who stayed invested saw dips recover over time, though that is never guaranteed.</p><button class="btn" data-a="x">Wait 24 hours</button><button class="btn g" data-a="pausesip">Pause my monthly investing instead</button><button class="btn g" data-a="wd2" style="color:var(--bad)">Withdraw anyway (demo)</button></div></div>`}
function render(top){const nav=tabs.includes(S.scr)?`<nav class="nav" aria-label="Main">${[['home','⌂','Home'],['explore','⌕','Explore'],['goals','◎','Goals'],['learn','✦','Learn'],['prof','☻','You']].map(t=>`<button class="${S.scr==t[0]?'on':''}" data-a="tab" data-v="${t[0]}" ${S.scr==t[0]?'aria-current="page"':''}><b aria-hidden="true">${t[1]}</b>${t[2]}</button>`).join('')}</nav>`:'';
const ae=document.activeElement,ak=ae&&ae.dataset&&ae.dataset.a?`[data-a="${ae.dataset.a}"]`+(ae.dataset.v!=null?`[data-v="${ae.dataset.v}"]`:''):ae&&ae.dataset&&ae.dataset.i?`[data-i="${ae.dataset.i}"]`:null;$('#app').innerHTML=V[S.scr]()+nav+(S.sheet?sheet():'');if(top)window.scrollTo(0,0);aria();if(top){const h=$('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}}else if(ak&&!S.sheet){const n=$(ak);if(n)n.focus({preventScroll:true})}
document.documentElement.dataset.theme=S.th=='auto'?'':S.th;if(!S.th||S.th=='auto')document.documentElement.removeAttribute('data-theme')}
const P={inc:v=>S.inc==v,rk:v=>S.rk==v,gl:v=>S.gl==v,plan:v=>(S.d.f||rec(S.d.mo))==v,gt:v=>S.d.g==v,filt:v=>S.filt==v,mk:v=>S.mk==v,tgl:v=>!!S.set[v]},LB={dm:'Monthly amount',dn:'Number of months',tg:'Target amount',mo:'Months to reach goal'};
function aria(){document.querySelectorAll('[data-a]').forEach(b=>{const q=P[b.dataset.a];if(q&&b.dataset.v!=null)b.setAttribute('aria-pressed',q(b.dataset.v))});document.querySelectorAll('input[type=range]').forEach(i=>i.setAttribute('aria-label',LB[i.dataset.i]));document.querySelectorAll('.t').forEach(t=>t.setAttribute('role','button'));const d=$('.sheet>div');if(d){d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');(d.querySelector('button')||d).focus()}}
const newGoal=(f)=>{S.d={g:S.gl||'Laptop',tg:GT[S.gl||'Laptop'][0],mo:GT[S.gl||'Laptop'][1],f:f||null,amt:0};go('goal')};
const A={ease(){S.d.mo=Math.min(120,S.d.mo*2);render()},n(){},nx(){S.st++;render(1)},obk(){S.st--;render(1)},inc(v){S.inc=v;S.st=2;render(1)},rk(v){S.rk=+v;S.st=3;render(1)},gl(v){S.gl=v;S.st=4;render(1)},fin(){S.hist=[];S.scr='home';render(1)},
tab(v){S.hist=[];S.scr=v;S.sheet=null;render(1)},fund(v){S.fund=v;S.dm=start();go('detail')},term(v){S.ret=['term',v];S.sheet={k:'term',v};render()},x(){S.sheet=null;render();const q=S.ret;S.ret=null;if(q){const n=$(`[data-a="${q[0]}"][data-v="${q[1]}"]`);if(n)n.focus({preventScroll:true})}},
mk(v){S.mk=v;render()},filt(v){S.filt=v;render()},link(){newGoal(S.fund)},newgoal(){newGoal()},
gt(v){S.d.g=v;S.d.tg=GT[v][0];S.d.mo=GT[v][1];S.d.f=null;render()},plan(v){S.d.f=v;$('#gl').innerHTML=goalLive();aria()},
review(){const d=S.d,f=d.f||rec(d.mo);d.f=f;d.amt=Math.max(100,Math.ceil(d.tg/fv(1,d.mo,6)/100)*100);S.chk=false;go('confirm')},
am(v){S.d.amt=Math.max(100,S.d.amt+ +v);render()},chk(){S.chk=!S.chk;render()},safer(){S.d.f=rec(S.d.mo);S.chk=false;render()},
start(){const d=S.d;S.goals.push({name:d.g,tg:d.tg,mo:d.mo,f:d.f,amt:d.amt,inv:d.amt,pause:0});S.hist=[];go('done',0)},
back(){S.scr=S.hist.pop()||'home';render(1)},top(v){S.sheet={k:'top',v};render()},topok(v){S.goals[v].inv+=S.goals[v].amt/2;S.sheet=null;render()},pz(v){S.goals[v].pause=!S.goals[v].pause;render()},

les(v){S.les=v==null?0:+v;S.ls=0;go('lesson')},ln(){if(S.ls<2){S.ls++;render(1)}else{S.learn[S.les]=1;S.scr='learn';S.hist=[];render(1)}},lp(){S.ls--;render(1)},
tgl(v){S.set[v]=S.set[v]?0:1;render()},theme(){S.th={auto:'light',light:'dark',dark:'auto'}[S.th];render()},retake(){S.st=1;S.scr='onb';render(1)},
reset(){location.reload()}};
const I={name(v){S.name=v.trim()},dm(v){S.dm=+v;$('#dml').textContent=R(S.dm);$('#out').innerHTML=outHTML(S.fund,S.dm,S.dn)},dn(v){S.dn=+v;$('#dnl').textContent=S.dn+' months';$('#out').innerHTML=outHTML(S.fund,S.dm,S.dn)},

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName=='INPUT'&&el.type=='checkbox'&&e.detail==0&&0)return;const f=A[el.dataset.a];if(f)f(el.dataset.v,el)});

render();
